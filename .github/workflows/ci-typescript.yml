name: CI • TypeScript

on:
  push:
    branches: [main]
    paths:
      - "bindings/typescript/**"
      - ".github/workflows/ci-typescript.yml"
  pull_request:
    paths:
      - "bindings/typescript/**"
      - ".github/workflows/ci-typescript.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: bindings/typescript

jobs:
  test:
    name: lint & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install dependencies
        # --ignore-scripts skips the optional node-gyp native build (C++ core).
        # The SDK falls back to a JS implementation when the addon is absent.
        run: npm ci --ignore-scripts

      - name: Type-check (lint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
