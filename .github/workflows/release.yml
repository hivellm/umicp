name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.1, v1.0.0, etc.

env:
  BUILD_TYPE: Release

jobs:
  # Build on Linux
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev \
          libwebsocketpp-dev libasio-dev libcurl4-openssl-dev \
          nlohmann-json3-dev pkg-config

    - name: Configure CMake
      working-directory: cpp
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DBUILD_SHARED_LIBS=ON \
          -DUMICP_BUILD_TESTS=ON \
          -DUMICP_BUILD_EXAMPLES=OFF \
          -DUMICP_ENABLE_WEBSOCKET=ON \
          -DUMICP_ENABLE_HTTP=ON

    - name: Build
      working-directory: cpp
      run: cmake --build build --config $BUILD_TYPE -j$(nproc)

    - name: Run tests
      working-directory: cpp
      run: cd build && ctest -C $BUILD_TYPE --output-on-failure

    - name: Install to staging
      working-directory: cpp
      run: |
        cd build
        make install DESTDIR=$PWD/install-staging
        
    - name: Create development package
      working-directory: cpp/build
      run: |
        # Create tar.gz with libraries, headers, and CMake config
        tar -czf umicp-dev-linux-x64.tar.gz \
          -C install-staging/usr \
          include/ lib/ \
          --transform 's,^,umicp-dev/'
        
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: umicp-linux-x64-${{ steps.get_version.outputs.VERSION }}
        path: cpp/build/umicp-dev-linux-x64.tar.gz
        retention-days: 90

  # Build on macOS
  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew update
        brew install cmake openssl nlohmann-json websocketpp asio curl

    - name: Configure CMake
      working-directory: cpp
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DBUILD_SHARED_LIBS=ON \
          -DUMICP_BUILD_TESTS=ON \
          -DUMICP_BUILD_EXAMPLES=OFF \
          -DUMICP_ENABLE_WEBSOCKET=ON \
          -DUMICP_ENABLE_HTTP=ON \
          -DOPENSSL_ROOT_DIR=/usr/local/opt/openssl

    - name: Build
      working-directory: cpp
      run: cmake --build build --config $BUILD_TYPE -j$(sysctl -n hw.ncpu)

    - name: Run tests
      working-directory: cpp
      run: cd build && ctest -C $BUILD_TYPE --output-on-failure

    - name: Install to staging
      working-directory: cpp
      run: |
        cd build
        make install DESTDIR=$PWD/install-staging

    - name: Create development package
      working-directory: cpp/build
      run: |
        tar -czf umicp-dev-macos-x64.tar.gz \
          -C install-staging/usr/local \
          include/ lib/ \
          --transform 's,^,umicp-dev/'

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: umicp-macos-x64-${{ steps.get_version.outputs.VERSION }}
        path: cpp/build/umicp-dev-macos-x64.tar.gz
        retention-days: 90

  # Build on Windows
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'master'
        
    - name: Install dependencies with vcpkg
      run: |
        vcpkg install nlohmann-json:x64-windows
        vcpkg install openssl:x64-windows
        vcpkg install websocketpp:x64-windows
        vcpkg install asio:x64-windows
        vcpkg install curl:x64-windows

    - name: Configure CMake
      working-directory: cpp
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DBUILD_SHARED_LIBS=ON `
          -DUMICP_BUILD_TESTS=ON `
          -DUMICP_BUILD_EXAMPLES=OFF `
          -DUMICP_ENABLE_WEBSOCKET=ON `
          -DUMICP_ENABLE_HTTP=ON

    - name: Build
      working-directory: cpp
      run: cmake --build build --config $env:BUILD_TYPE -j $env:NUMBER_OF_PROCESSORS

    - name: Run tests
      working-directory: cpp
      run: cd build; ctest -C $env:BUILD_TYPE --output-on-failure

    - name: Install to staging
      working-directory: cpp
      run: |
        cd build
        cmake --install . --prefix install-staging --config $env:BUILD_TYPE

    - name: Create development package
      working-directory: cpp/build
      run: |
        # Create ZIP with DLLs, LIBs, headers, and CMake config
        Compress-Archive -Path install-staging/* -DestinationPath umicp-dev-windows-x64.zip

    - name: Get version from tag
      id: get_version
      run: |
        $version = "$env:GITHUB_REF" -replace 'refs/tags/v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: umicp-windows-x64-${{ steps.get_version.outputs.VERSION }}
        path: cpp/build/umicp-dev-windows-x64.zip
        retention-days: 90

  # Create GitHub Release
  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: UMICP C++ Library v${{ steps.get_version.outputs.VERSION }}
        body: |
          # UMICP C++ Library v${{ steps.get_version.outputs.VERSION }}
          
          ## 🚀 Release Notes
          
          Universal Matrix Intelligent Communication Protocol - High-performance C++ library for AI model interoperability.
          
          ## 📦 Development Packages
          
          Download the appropriate package for your platform and extract it to your development environment.
          
          ### Linux (x64)
          - `umicp-dev-linux-x64.tar.gz` - Shared libraries (.so), headers, CMake config
          - **Contents**: `libumicp.so`, headers in `include/`, CMake files
          
          ### macOS (x64)
          - `umicp-dev-macos-x64.tar.gz` - Dynamic libraries (.dylib), headers, CMake config
          - **Contents**: `libumicp.dylib`, headers in `include/`, CMake files
          
          ### Windows (x64)
          - `umicp-dev-windows-x64.zip` - DLLs, import libraries (.lib), headers, CMake config
          - **Contents**: `umicp.dll`, `umicp.lib`, headers in `include/`, CMake files
          
          ## 🔧 Installation
          
          ### Extract and Install (Linux/macOS)
          
          ```bash
          # Extract
          tar -xzf umicp-dev-linux-x64.tar.gz
          cd umicp-dev
          
          # Copy to system directories (requires sudo)
          sudo cp -r include/* /usr/local/include/
          sudo cp -r lib/* /usr/local/lib/
          sudo ldconfig  # Linux only
          ```
          
          ### Extract and Use (Windows)
          
          ```powershell
          # Extract to your project directory
          Expand-Archive umicp-dev-windows-x64.zip -DestinationPath C:\Libraries\umicp
          
          # Add to your CMake project:
          # set(UMICP_DIR "C:/Libraries/umicp")
          ```
          
          ## 💻 Using in Your Project
          
          ### With CMake
          
          ```cmake
          cmake_minimum_required(VERSION 3.15)
          project(MyProject)
          
          # Find UMICP
          find_package(UMICP REQUIRED CONFIG)
          
          # Link to your executable/library
          add_executable(my_app main.cpp)
          target_link_libraries(my_app PRIVATE UMICP::UMICP)
          ```
          
          ### Manual Compilation
          
          ```bash
          # Linux/macOS
          g++ -std=c++17 my_app.cpp -lumicp -lssl -lcrypto -o my_app
          
          # Windows (MSVC)
          cl /std:c++17 my_app.cpp umicp.lib /link /out:my_app.exe
          ```
          
          ## 📚 Quick Start Example
          
          ```cpp
          #include <umicp/envelope.hpp>
          #include <umicp/matrix.hpp>
          #include <iostream>
          
          int main() {
              // Create an envelope
              umicp::Envelope env;
              env.setFrom("system-a");
              env.setTo("system-b");
              env.setOperation(umicp::OperationType::DATA);
              
              // Create a matrix
              umicp::Matrix mat(3, 3);
              mat.fill(1.0);
              
              // Use cosine similarity
              double similarity = mat.cosineSimilarity(mat);
              
              std::cout << "UMICP initialized successfully!" << std::endl;
              std::cout << "Similarity: " << similarity << std::endl;
              
              return 0;
          }
          ```
          
          ## ✨ Features
          
          - ✅ **Core Protocol**: Envelope, Frame, Matrix operations
          - ✅ **Transport Layer**: WebSocket, HTTP/HTTP2
          - ✅ **SIMD Acceleration**: Optimized matrix operations
          - ✅ **Cross-platform**: Linux, macOS, Windows
          - ✅ **C++17**: Modern C++ standard
          - ✅ **Thread-safe**: Safe for concurrent use
          
          ## 📋 Requirements
          
          **Build Requirements** (already included in packages):
          - C++17 compatible compiler (GCC 7+, Clang 5+, MSVC 2017+)
          
          **Runtime Dependencies**:
          - OpenSSL 1.1.1+ (libssl, libcrypto)
          - For WebSocket: websocketpp, asio
          - For HTTP: libcurl
          
          ## 📖 Documentation
          
          - [API Reference](https://github.com/hivellm/umicp/tree/main/cpp/docs)
          - [Examples](https://github.com/hivellm/umicp/tree/main/cpp/examples)
          - [Integration Guide](https://github.com/hivellm/umicp/blob/main/cpp/docs/INTEGRATION.md)
          
          ## 📦 Package Managers
          
          Coming soon:
          - **Conan**: `conan install --requires=umicp/${{ steps.get_version.outputs.VERSION }}`
          - **vcpkg**: `vcpkg install umicp`
          
          ## 🐛 Bug Reports
          
          Report issues at: https://github.com/hivellm/umicp/issues
          
          ---
          
          **Full Changelog**: https://github.com/hivellm/umicp/compare/v${{ steps.get_version.outputs.VERSION }}...main
        files: |
          artifacts/**/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to Conan (optional - requires Conan credentials)
  publish-conan:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect

    - name: Create Conan package
      working-directory: cpp
      run: |
        conan create . --build=missing
        
    # Uncomment when ready to publish to Conan Center
    # - name: Upload to Conan Center
    #   run: |
    #     conan upload umicp/${{ steps.get_version.outputs.VERSION }} --all -r conancenter
    #   env:
    #     CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
    #     CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}

