name: CI • Elixir

on:
  push:
    branches: [main]
    paths:
      - "bindings/elixir/**"
      - ".github/workflows/ci-elixir.yml"
  pull_request:
    paths:
      - "bindings/elixir/**"
      - ".github/workflows/ci-elixir.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: bindings/elixir

jobs:
  test:
    name: format, credo & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            bindings/elixir/deps
            bindings/elixir/_build
          key: mix-${{ runner.os }}-${{ hashFiles('bindings/elixir/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install deps
        run: mix deps.get

      # Advisory until the existing formatting debt is cleaned up (`mix format`).
      - name: Format check
        run: mix format --check-formatted
        continue-on-error: true

      - name: Credo
        run: mix credo --strict
        continue-on-error: true

      - name: Test
        run: mix test
