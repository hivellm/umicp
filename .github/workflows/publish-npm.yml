name: Publish • TypeScript (npm)

# Trusted Publishing (OIDC) with provenance — no NPM_TOKEN required.
# One-time setup on npmjs.com: package @hivehub/umicp-sdk -> Settings -> Trusted Publisher
#   Provider: GitHub Actions | Owner: hivellm | Repo: umicp | Workflow: publish-npm.yml
# Requires npm >= 11.5.1 (installed below) and an npm org that allows the package scope.
#
# Release trigger: GitHub Release with tag `typescript-v<version>` (e.g. typescript-v0.3.2).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + pack only, do not publish"
        type: boolean
        default: false

defaults:
  run:
    working-directory: bindings/typescript

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'typescript-v')
    permissions:
      id-token: write # required for OIDC trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --provenance --access public --dry-run

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --provenance --access public
