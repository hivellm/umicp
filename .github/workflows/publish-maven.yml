name: Publish • Java + Kotlin (Maven Central)

# Maven Central does NOT support OIDC trusted publishing — token-based via the
# Central Portal. Requires these repo secrets:
#   CENTRAL_USERNAME     - Central Portal user token name
#   CENTRAL_PASSWORD     - Central Portal user token password
#   MAVEN_GPG_PRIVATE_KEY- ASCII-armored GPG private key used to sign artifacts
#   MAVEN_GPG_PASSPHRASE - passphrase for that key
#
# Release trigger: GitHub Release with tag `java-v<version>` or `kotlin-v<version>`.
# Choose the module with the workflow_dispatch input, or it is inferred from the tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      module:
        description: "Which module to publish"
        type: choice
        options: [java, kotlin]
        default: java
      dry_run:
        description: "Build + sign only, do not deploy"
        type: boolean
        default: false

jobs:
  publish:
    name: publish ${{ github.event.inputs.module || 'from-tag' }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'java-v') ||
      startsWith(github.event.release.tag_name, 'kotlin-v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target module
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "module=${{ inputs.module }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.release.tag_name }}" == kotlin-v* ]]; then
            echo "module=kotlin" >> "$GITHUB_OUTPUT"
          else
            echo "module=java" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK + Maven settings
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # ---- Java (Maven) ----
      - name: Deploy Java to Central
        if: steps.target.outputs.module == 'java'
        working-directory: bindings/java
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            mvn -B -P release verify
          else
            mvn -B -P release deploy -DskipTests
          fi
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # ---- Kotlin (Gradle) ----
      - name: Set up Gradle
        if: steps.target.outputs.module == 'kotlin'
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Kotlin to Central
        if: steps.target.outputs.module == 'kotlin' && inputs.dry_run != true
        working-directory: bindings/kotlin
        run: ./gradlew publish --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Kotlin build (dry-run)
        if: steps.target.outputs.module == 'kotlin' && inputs.dry_run == true
        working-directory: bindings/kotlin
        run: ./gradlew build --no-daemon --stacktrace
