name: CI • Java

on:
  push:
    branches: [main]
    paths:
      - "bindings/java/**"
      - ".github/workflows/ci-java.yml"
  pull_request:
    paths:
      - "bindings/java/**"
      - ".github/workflows/ci-java.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: bindings/java

jobs:
  test:
    name: build & test (jdk ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build & test
        run: mvn -B verify
