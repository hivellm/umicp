name: Publish • Rust (crates.io)

# Trusted Publishing (OIDC) — no CARGO_REGISTRY_TOKEN required.
# One-time setup on crates.io: crate umicp-sdk -> Settings -> Trusted Publishing
#   Repository: hivellm/umicp | Workflow: publish-rust.yml | Environment: crates-io
#
# Release trigger: GitHub Release with tag `rust-v<version>` (e.g. rust-v0.3.1).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "cargo publish --dry-run only"
        type: boolean
        default: false

defaults:
  run:
    working-directory: bindings/rust

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'rust-v')
    environment: crates-io
    permissions:
      id-token: write # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust

      - name: Test
        run: cargo test --all-features

      - name: Package (verify)
        run: cargo package --allow-dirty

      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: cargo publish --dry-run --allow-dirty

      - name: Authenticate to crates.io (OIDC)
        if: github.event_name == 'release' || inputs.dry_run == false
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
