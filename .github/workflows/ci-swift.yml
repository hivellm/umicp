name: CI • Swift

on:
  push:
    branches: [main]
    paths:
      - "bindings/swift/**"
      - ".github/workflows/ci-swift.yml"
  pull_request:
    paths:
      - "bindings/swift/**"
      - ".github/workflows/ci-swift.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: bindings/swift

jobs:
  test:
    name: build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v
