name: Publish • Python (PyPI)

# Trusted Publishing (OIDC) — no API token/secret required.
# One-time setup: https://pypi.org/manage/project/umicp-sdk/settings/publishing/
#   Owner: hivellm | Repo: umicp | Workflow: publish-python.yml | Environment: pypi
#
# Release trigger: create a GitHub Release with tag `python-v<version>` (e.g. python-v0.3.2).
# Manual trigger: Actions -> "Publish • Python (PyPI)" -> Run workflow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not publish"
        type: boolean
        default: false

defaults:
  run:
    working-directory: bindings/python

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'python-v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: bindings/python/dist/*

  publish:
    name: publish to PyPI
    needs: build
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/umicp-sdk/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
